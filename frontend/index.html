<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>毛泽东生平时空叙事 · 3D 立体地图</title>
    <script>
      // ES5 错误兜底：任何 JS 报错都在页面上直接显示，避免无声白屏
      window.onerror = function (msg, src, line, col) {
        var el = document.getElementById('boot-error');
        if (!el) {
          el = document.createElement('div');
          el.id = 'boot-error';
          el.setAttribute('style', 'position:fixed;inset:auto 16px 16px 16px;z-index:99999;background:#2a0a0a;color:#ffd9d9;border:1px solid #a33;padding:12px 16px;font:13px/1.6 monospace;border-radius:8px;max-height:40vh;overflow:auto;white-space:pre-wrap;');
          (document.body || document.documentElement).appendChild(el);
        }
        el.textContent += '[启动错误] ' + msg + ' @' + (src || '?') + ':' + line + ':' + col + '\n';
      };
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="全屏电影级沉浸式毛泽东生平时空叙事 3D 立体地图，星火燎原，红遍九州。" />
    <meta name="author" content="Genie" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
